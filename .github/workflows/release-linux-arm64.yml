name: Build Uni-HWP Linux ARM64 Release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_INCREMENTAL: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-linux-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux-arm64:
    name: Linux ARM64 AppImage
    # Native ARM64 avoids the very slow QEMU path used on x64 runners.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure parallel build
        shell: bash
        run: |
          set -euo pipefail
          jobs="$(nproc)"
          test "$jobs" -ge 1
          echo "CARGO_BUILD_JOBS=$jobs" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_PIPELINING=true" >> "$GITHUB_ENV"
          echo "MAKEFLAGS=-j$jobs" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$jobs" >> "$GITHUB_ENV"
          echo "RAYON_NUM_THREADS=$jobs" >> "$GITHUB_ENV"
          echo "Using $jobs CPU workers for Cargo, Make, CMake, and Rayon"

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c "import json, pathlib; print(json.loads(pathlib.Path('src-tauri/tauri.conf.json').read_text())['version'])")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf file binutils libfuse2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build shared WASM package
        run: wasm-pack build --target web --out-dir pkg --release

      - name: Install frontend dependencies
        working-directory: apps/studio
        run: npm ci --prefer-offline --no-audit

      - name: Build frontend
        working-directory: apps/studio
        run: npm run build

      - name: Install Tauri CLI
        run: npm install --global @tauri-apps/cli@2

      - name: Verify toolchain and target architecture
        shell: bash
        run: |
          set -euo pipefail
          uname -m
          rustc -Vv
          node --version
          npm --version
          cargo tauri --version
          test "$(uname -m)" = "aarch64"

      - name: Build ARM64 AppImage
        working-directory: src-tauri
        run: cargo tauri build --bundles appimage

      - name: Normalize and verify artifact
        id: artifact
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist-release
          artifact="$(find target/release/bundle/appimage -type f -name '*.AppImage' -print -quit)"
          test -n "$artifact"
          output="dist-release/Uni-HWP_linux_arm64_ko-KR_v${RELEASE_VERSION}.AppImage"
          cp "$artifact" "$output"
          file_output="$(file "$output")"
          printf '%s\n' "$file_output"
          printf '%s\n' "$file_output" | grep -Eiq 'aarch64|arm64'
          sha256sum "$output" > "$output.sha256"
          test -s "$output" && test -s "$output.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm64-appimage
          path: dist-release/*

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "${{ github.repository }}" \
              --target "${GITHUB_SHA}" --title "$RELEASE_TAG" --notes ""
          fi
          gh release upload "$RELEASE_TAG" dist-release/* \
            --repo "${{ github.repository }}" --clobber

      - name: Refresh release download site
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy-site.yml \
            --repo "${{ github.repository }}" --ref main
