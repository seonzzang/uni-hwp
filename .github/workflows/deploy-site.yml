name: Deploy Uni-HWP Site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_INCREMENTAL: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-site:
    name: Build site and web demo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build WASM pkg
        run: wasm-pack build --target web --out-dir pkg --release

      - name: Install frontend dependencies
        working-directory: apps/studio
        run: npm ci --prefer-offline --no-audit

      - name: Build web demo
        working-directory: apps/studio
        env:
          GITHUB_PAGES: "true"
          GITHUB_PAGES_BASE: "/uni-hwp/demo/"
        run: npm run build

      - name: Assemble Pages site
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_version="$(python3 - <<'PY'
import json, pathlib
print(json.loads(pathlib.Path('src-tauri/tauri.conf.json').read_text(encoding='utf-8'))['version'])
PY
)"
          export RELEASE_VERSION="$release_version"
          deploy_time="$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          release_history_rows="$(python3 - <<'PY'
import html
import json
import os
from datetime import datetime
from urllib.request import Request, urlopen

repo = os.environ["GITHUB_REPOSITORY"]
token = os.environ["GH_TOKEN"]
request = Request(
    f"https://api.github.com/repos/{repo}/releases?per_page=100",
    headers={
        "Accept": "application/vnd.github+json",
        "Authorization": f"Bearer {token}",
        "X-GitHub-Api-Version": "2022-11-28",
        "User-Agent": "uni-hwp-release-site",
    },
)
with urlopen(request) as response:
    releases = json.loads(response.read().decode("utf-8"))

asset_suffixes = {
    "win_setup": "Uni-HWP_windows_x64_ko-KR_setup_v{version}.exe",
    "win_portable": "Uni-HWP_windows_x64_ko-KR_portable_v{version}.zip",
    "mac_arm": "Uni-HWP_macos_aarch64_ko-KR_v{version}.dmg",
    "mac_intel": "Uni-HWP_macos_x64_ko-KR_v{version}.dmg",
    "linux": "Uni-HWP_linux_x64_ko-KR_v{version}.AppImage",
}

def find_asset_url(assets, template, version):
    name = template.format(version=version)
    for asset in assets:
        if asset.get("name") == name:
            return asset.get("browser_download_url")
    return None

rows = []
for release in releases:
    if release.get("draft") or release.get("prerelease"):
        continue
    version = (release.get("tag_name") or release.get("name") or "").lstrip("v")
    if not version:
        continue
    published_at = release.get("published_at")
    if published_at:
        published_at = datetime.fromisoformat(published_at.replace("Z", "+00:00")).astimezone().strftime("%Y-%m-%d")
    else:
        published_at = "미정"
    assets = release.get("assets", [])
    def link(label, url):
        if url:
            return f'<a href="{html.escape(url, quote=True)}" target="_blank" rel="noopener">{label}</a>'
        return '<span class="asset-missing">-</span>'
    rows.append(
        "<tr>"
        f'<td class="history-date">{html.escape(published_at)}</td>'
        f"<td>{link('데모', '/uni-hwp/demo/')}</td>"
        f"<td>{link('다운로드', find_asset_url(assets, asset_suffixes['win_setup'], version))}</td>"
        f"<td>{link('다운로드', find_asset_url(assets, asset_suffixes['win_portable'], version))}</td>"
        f"<td>{link('다운로드', find_asset_url(assets, asset_suffixes['mac_arm'], version))}</td>"
        f"<td>{link('다운로드', find_asset_url(assets, asset_suffixes['mac_intel'], version))}</td>"
        f"<td>{link('다운로드', find_asset_url(assets, asset_suffixes['linux'], version))}</td>"
        "</tr>"
    )

if not rows:
    print('<tr><td class="history-empty" colspan="7">아직 공개된 릴리즈가 없습니다.</td></tr>')
else:
    print("\n".join(rows))
PY
)"
          rm -rf pages-site
          mkdir -p pages-site/demo pages-site/assets/landing
          printf '%s' "$release_history_rows" > pages-site/release_history_rows.html
          printf '%s' "$deploy_time" > pages-site/deploy_time.txt
          python3 - <<'PY'
from pathlib import Path
import os

source = Path("site/index.html").read_text(encoding="utf-8")
source = source.replace("__RELEASE_VERSION__", os.environ["RELEASE_VERSION"])
source = source.replace("__DEPLOYED_AT__", Path("pages-site/deploy_time.txt").read_text(encoding="utf-8"))
source = source.replace("__RELEASE_HISTORY_ROWS__", Path("pages-site/release_history_rows.html").read_text(encoding="utf-8"))
Path("pages-site/index.html").write_text(source, encoding="utf-8")
PY
          rm -f pages-site/release_history_rows.html pages-site/deploy_time.txt
          cp -R site/assets/landing/. pages-site/assets/landing/
          cp -R apps/studio/dist/. pages-site/demo/

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-site

  deploy-site:
    name: Deploy site
    needs: build-site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
