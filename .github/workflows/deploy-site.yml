name: Deploy Uni-HWP Site

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-site:
    name: Generate release site and web demo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install WASM toolchain
        run: cargo install wasm-pack --locked

      - name: Build web WASM package
        run: wasm-pack build --target web --out-dir pkg --release

      - name: Install web dependencies
        working-directory: apps/studio
        run: npm ci --prefer-offline --no-audit

      - name: Build web demo
        working-directory: apps/studio
        env:
          GITHUB_PAGES: "true"
          GITHUB_PAGES_BASE: "/uni-hwp/demo/"
        run: npm run build

      - name: Generate site from all GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c "import json, pathlib; print(json.loads(pathlib.Path('src-tauri/tauri.conf.json').read_text())['version'])")"
          deploy_time="$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          rm -rf pages-site
          mkdir -p pages-site/demo pages-site/assets/landing
          printf '%s' "$deploy_time" > pages-site/deploy_time.txt
          # The renderer fetches up to 100 public releases and keeps them newest first.
          python3 scripts/render_release_history.py > pages-site/release_history_rows.html
          python3 scripts/render_pages_site.py site/index.html pages-site/index.html "$version"
          cp -R site/assets/landing/. pages-site/assets/landing/
          cp -R apps/studio/dist/. pages-site/demo/
          rm -f pages-site/release_history_rows.html pages-site/deploy_time.txt

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-site

  deploy:
    name: Deploy GitHub Pages
    needs: build-site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
