name: Rebuild Historical Linux ARM64 Releases

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_INCREMENTAL: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-linux-arm64-history
  cancel-in-progress: false

jobs:
  build-linux-arm64:
    name: Linux ARM64 ${{ matrix.tag }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: v8.1.102
            version: 8.1.102
          - tag: v8.1.101
            version: 8.1.101
          - tag: v0.8.100
            version: 0.8.100
    steps:
      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          ref: ${{ matrix.tag }}
          fetch-depth: 0

      - name: Configure parallel build
        shell: bash
        run: |
          set -euo pipefail
          jobs="$(nproc)"
          test "$jobs" -ge 1
          echo "CARGO_BUILD_JOBS=$jobs" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_PIPELINING=true" >> "$GITHUB_ENV"
          echo "MAKEFLAGS=-j$jobs" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$jobs" >> "$GITHUB_ENV"
          echo "RAYON_NUM_THREADS=$jobs" >> "$GITHUB_ENV"
          echo "Using $jobs CPU workers for ${{ matrix.tag }}"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf file binutils libfuse2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build shared WASM package
        run: wasm-pack build --target web --out-dir pkg --release

      - name: Install frontend dependencies
        working-directory: apps/studio
        run: npm ci --prefer-offline --no-audit

      - name: Build frontend
        working-directory: apps/studio
        run: npm run build

      - name: Install Tauri CLI
        run: npm install --global @tauri-apps/cli@2

      - name: Verify ARM64 toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          tauri --version
          rustc -Vv

      - name: Build ARM64 AppImage
        working-directory: src-tauri
        run: tauri build --bundles appimage

      - name: Normalize and verify artifact
        shell: bash
        env:
          RELEASE_VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          mkdir -p dist-release
          artifact="$(find target/release/bundle/appimage -type f -name '*.AppImage' -print -quit)"
          test -n "$artifact"
          output="dist-release/Uni-HWP_linux_arm64_ko-KR_v${RELEASE_VERSION}.AppImage"
          cp "$artifact" "$output"
          file_output="$(file "$output")"
          printf '%s\n' "$file_output"
          printf '%s\n' "$file_output" | grep -Eiq 'aarch64|arm64'
          sha256sum "$output" > "$output.sha256"
          test -s "$output" && test -s "$output.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm64-${{ matrix.tag }}
          path: dist-release/*

      - name: Upload to matching GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ matrix.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" dist-release/* \
            --repo "${{ github.repository }}" --clobber

  deploy-site:
    name: Refresh release site after historical uploads
    needs: build-linux-arm64
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch site deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-site.yml --repo "${{ github.repository }}" --ref main
