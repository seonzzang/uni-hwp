name: Sync upstream RHWP

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream-rhwp
  cancel-in-progress: true

jobs:
  sync:
    name: Sync upstream changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/edwardkim/rhwp.git || true
          git fetch upstream --tags

      - name: Validate sync boundary
        run: bash tools/check-upstream-sync-boundary.sh

      - name: Resolve latest stable RHWP tag
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          sync_ref="$(git ls-remote --tags --refs upstream 'refs/tags/v[0-9]*' | awk -F/ '{print $3}' | sort -V | tail -n 1)"
          test -n "$sync_ref"
          echo "sync_ref=$sync_ref" >> "$GITHUB_OUTPUT"
          echo "Selected RHWP stable tag: $sync_ref"

          current_tag="$(python -c "import json; print(json.load(open('release/uni-hwp-release.json'))['engineTag'])")"
          if [ "$current_tag" = "$sync_ref" ]; then
            upstream_commit="$(git rev-parse "${sync_ref}^{commit}")"
            recorded_commit="$(python -c "import json; print(json.load(open('release/uni-hwp-release.json'))['engineCommit'])")"
            upstream_tree_hash="$(git ls-tree -r "$sync_ref" -- assets bindings npm samples src template tests ttfs typescript | git hash-object --stdin)"
            recorded_tree_hash="$(python -c "import json; print(json.load(open('release/uni-hwp-release.json'))['engineSourceHash'].removeprefix('git-tree-sha1:'))")"

            if [ "$recorded_commit" != "$upstream_commit" ] || [ "$recorded_tree_hash" != "$upstream_tree_hash" ]; then
              echo "ENGINE_PROVENANCE_MISMATCH: recorded $current_tag does not match the upstream source tree." >&2
              echo "Recorded commit: $recorded_commit" >&2
              echo "Upstream commit: $upstream_commit" >&2
              echo "Recorded tree: $recorded_tree_hash" >&2
              echo "Upstream tree: $upstream_tree_hash" >&2
              exit 1
            fi

            python tools/check_release_metadata.py --check-engine-tree
            echo "action=no_update" >> "$GITHUB_OUTPUT"
            echo "NO_UPDATE: $sync_ref is already fully represented by the locked engine provenance."
          else
            echo "action=sync" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Actions PR permission before candidate sync
        if: steps.sync.outputs.action == 'sync'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          can_approve="$(gh api "repos/$GITHUB_REPOSITORY/actions/permissions" --jq '.can_approve_pull_request_reviews // false')"
          if [ "$can_approve" != "true" ]; then
            echo "ACTIONS_PR_PERMISSION_REQUIRED: enable the repository setting allowing Actions to create and approve pull requests before syncing a candidate." >&2
            exit 1
          fi

      - name: Sync upstream source files
        if: steps.sync.outputs.action == 'sync'
        shell: bash
        env:
          SYNC_REF: ${{ steps.sync.outputs.sync_ref }}
        run: |
          set -euo pipefail

          sync_ref="$SYNC_REF"
          sync_paths=(
            "assets"
            "bindings"
            "examples"
            "npm"
            "samples"
            "src"
            "template"
            "tests"
            "ttfs"
            "typescript"
          )

          for path in "${sync_paths[@]}"; do
            if git cat-file -e "${sync_ref}:${path}" 2>/dev/null; then
              rm -rf "$path"
              git checkout "$sync_ref" -- "$path"
            fi
          done

      - name: Detect changes
        id: changes
        if: steps.sync.outputs.action == 'sync'
        run: |
          protected=(
            "scripts/render_release_history.py"
            "scripts/render_pages_site.py"
            "site/index.html"
            "release/uni-hwp-release.json"
            "release/version-history.json"
          )
          for path in "${protected[@]}"; do
            if git diff --name-only -- "$path" | grep -q .; then
              echo "Protected product file changed during upstream sync: $path" >&2
              exit 1
            fi
          done
          test -f scripts/render_release_history.py
          test -f scripts/render_pages_site.py
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Inspect diff
        if: steps.sync.outputs.action == 'sync' && steps.changes.outputs.changed == 'true'
        run: git diff --stat

      - name: Commit sync changes
        if: steps.sync.outputs.action == 'sync' && steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          candidate_branch="automation/rhwp-${sync_ref#v}"
          if git ls-remote --exit-code --heads origin "$candidate_branch" >/dev/null 2>&1; then
            echo "Candidate branch already exists: $candidate_branch"
            exit 0
          fi
          git switch -c "$candidate_branch"
          git add -A
          git commit -m "chore: sync upstream RHWP ${sync_ref}"
          git push origin "HEAD:$candidate_branch"
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$candidate_branch" \
            --title "chore: sync upstream RHWP ${sync_ref}" \
            --body "RHWP 후보 ${sync_ref}를 동기화했습니다. 호환성 검증 통과 후 병합합니다."
        env:
          GH_TOKEN: ${{ github.token }}
          sync_ref: ${{ steps.sync.outputs.sync_ref }}
