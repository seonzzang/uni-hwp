name: Sync upstream RHWP

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream-rhwp
  cancel-in-progress: true

jobs:
  sync:
    name: Sync upstream changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/edwardkim/rhwp.git || true
          git fetch upstream main --tags

      - name: Create sync branch
        run: |
          branch="sync/upstream-rhwp-$(date -u +%Y%m%d-%H%M%S)"
          echo "SYNC_BRANCH=$branch" >> "$GITHUB_ENV"
          git checkout -b "$branch"

      - name: Sync upstream source files
        shell: bash
        run: |
          set -euo pipefail

          sync_paths=(
            "Cargo.toml"
            "Cargo.lock"
            "examples"
            "npm"
            "src"
            "scripts"
            "template"
            "tests"
            "ttfs"
            "typescript"
            "web"
          )

          for path in "${sync_paths[@]}"; do
            if git cat-file -e "upstream/main:${path}" 2>/dev/null; then
              rm -rf "$path"
              git checkout upstream/main -- "$path"
            fi
          done

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Inspect diff
        if: steps.changes.outputs.changed == 'true'
        run: git diff --stat

      - name: Commit sync changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git add -A
          git commit -m "chore: sync upstream RHWP"
          git push origin "${SYNC_BRANCH}"

      - name: Open pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_url="$(gh pr create \
            --repo "${{ github.repository }}" \
            --base main \
            --head "${SYNC_BRANCH}" \
            --title "chore: sync upstream RHWP" \
            --body $'This PR syncs shared source files from `edwardkim/rhwp` into `uni-hwp`.\n\nRepo-specific files such as `apps/`, `docs/public/`, site deployment, and release workflows are intentionally left untouched.')"
          echo "PR_URL=$pr_url" >> "$GITHUB_ENV"

      - name: Enable auto-merge
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge --auto --merge "$PR_URL" --repo "${{ github.repository }}"
