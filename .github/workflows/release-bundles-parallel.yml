name: Build Uni-HWP Release Bundles Parallel

on:
  push:
    branches:
      - main
      - "release/**"
    paths:
      - "apps/studio/src/**"
      - "assets/**"
      - "bindings/**"
      - "npm/**"
      - "samples/**"
      - "src/**"
      - "src-tauri/**"
      - "template/**"
      - "tests/**"
      - "ttfs/**"
      - "typescript/**"
      - "release/**"
  workflow_dispatch:
    inputs:
      release_mode:
        description: "릴리스 실행 모드"
        required: true
        default: validate
        type: choice
        options:
          - validate
          - publish

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

env:
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_INCREMENTAL: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-bundles-parallel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-release:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      release_mode: ${{ steps.meta.outputs.release_mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c "import json, pathlib; print(json.loads(pathlib.Path('apps/studio/src/assets/product-info.json').read_text(encoding='utf-8'))['fullVersion'])")"
          if [ -z "$version" ]; then
            echo "Unable to resolve Uni-HWP full version from product-info.json" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "release_mode=${{ inputs.release_mode }}" >> "$GITHUB_OUTPUT"
          else
            echo "release_mode=validate" >> "$GITHUB_OUTPUT"
          fi

  preflight:
    name: Validate release candidate
    needs: prepare-release
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.guard.outputs.should_build }}
      release_key: ${{ steps.guard.outputs.release_key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate release metadata and deduplicate
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_MODE: ${{ needs.prepare-release.outputs.release_mode }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_release_metadata.py --check-engine-tree
          release_key="${RELEASE_VERSION}|${RELEASE_TAG}|$(python -c "import json; print(json.load(open('release/uni-hwp-release.json'))['engineCommit'])")|$(python -c "import json; print(json.load(open('release/uni-hwp-release.json'))['engineSourceHash'])")"
          echo "release_key=$release_key" >> "$GITHUB_OUTPUT"
          if [ "$RELEASE_MODE" != "publish" ]; then
            echo "RELEASE_VALIDATION_ONLY: $RELEASE_MODE"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json body --jq .body | grep -Fq "releaseKey: $release_key"; then
              echo "ALREADY_BUILT: $release_key"
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Release $RELEASE_TAG already exists with different provenance." >&2
            exit 1
          fi
          echo "should_build=true" >> "$GITHUB_OUTPUT"

  compatibility-check:
    name: Verify Uni-HWP compatibility
    needs: [prepare-release, preflight]
    if: needs.preflight.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Rust adapter
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/studio
        run: npm ci --prefer-offline --no-audit

      - name: Run Studio unit tests
        run: npm run test:unit --prefix apps/studio

      - name: Validate release metadata
        run: python tools/check_release_metadata.py --check-engine-tree

  build-wasm-pkg:
    name: Build shared WASM pkg
    needs: [prepare-release, preflight, compatibility-check]
    if: needs.preflight.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build WASM pkg
        run: wasm-pack build --target web --out-dir pkg --release

      - name: Upload WASM pkg artifact
        uses: actions/upload-artifact@v7
        with:
          name: uni-hwp-wasm-pkg-desktop
          path: |
            pkg/rhwp.js
            pkg/rhwp.d.ts
            pkg/rhwp_bg.wasm
            pkg/rhwp_bg.wasm.d.ts
            pkg/package.json
            pkg/LICENSE
            pkg/README.md

  build-windows:
    name: Windows x64 installer + portable
    needs: [prepare-release, preflight, compatibility-check, build-wasm-pkg]
    if: needs.preflight.outputs.should_build == 'true'
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache Rust
        if: runner.os != 'Linux'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json

      - name: Download WASM pkg artifact
        uses: actions/download-artifact@v7
        with:
          name: uni-hwp-wasm-pkg-desktop
          path: pkg

      - name: Install frontend dependencies
        working-directory: apps/studio
        run: npm ci --prefer-offline --no-audit

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Windows bundles
        working-directory: src-tauri
        run: tauri build --target x86_64-pc-windows-msvc --bundles "nsis,msi"

      - name: Normalize Windows artifacts
        shell: powershell
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          $version = $env:RELEASE_VERSION
          $dist = "dist-release"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          $installer = Get-ChildItem "target" -Recurse -Include "*-setup.exe","*_setup.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "Windows installer artifact not found." }
          $installerStableName = "Uni-HWP_windows_x64_ko-KR_setup_v$version.exe"
          Copy-Item $installer.FullName (Join-Path $dist $installerStableName) -Force

          $msi = Get-ChildItem "target" -Recurse -Filter "*.msi" -File | Select-Object -First 1
          if (-not $msi) { throw "Windows MSI artifact not found." }
          $msiStableName = "Uni-HWP_windows_x64_ko-KR_msi_v$version.msi"
          Copy-Item $msi.FullName (Join-Path $dist $msiStableName) -Force

          $portableDir = Join-Path $dist "portable"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          $portableExe = Get-ChildItem "target" -Recurse -Filter "uni-hwp.exe" |
            Where-Object { $_.FullName -notmatch "\\bundle\\" } |
            Select-Object -First 1
          if (-not $portableExe) { throw "Windows portable executable not found." }
          Copy-Item $portableExe.FullName (Join-Path $portableDir "Uni-HWP.exe") -Force
          $portableStableName = "Uni-HWP_windows_x64_ko-KR_portable_v$version.zip"
          Compress-Archive -Path (Join-Path $portableDir "*") -DestinationPath (Join-Path $dist $portableStableName) -Force

          foreach ($name in @($installerStableName, $msiStableName, $portableStableName)) {
            $file = Join-Path $dist $name
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            Set-Content -Path "${file}.sha256" -Value "$hash *$name" -Encoding ascii
          }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-release-bundles
          path: |
            dist-release/*.exe
            dist-release/*.zip
            dist-release/*.sha256

  build-macos:
    name: ${{ matrix.name }}
    needs: [prepare-release, preflight, compatibility-check, build-wasm-pkg]
    if: needs.preflight.outputs.should_build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
            bundle: dmg
            artifact_glob: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: macOS Intel
            os: macos-14
            target: x86_64-apple-darwin
            bundle: dmg
            artifact_glob: target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - name: Download WASM pkg artifact
        uses: actions/download-artifact@v7
        with:
          name: uni-hwp-wasm-pkg-desktop
          path: pkg
      - name: Install frontend dependencies
        working-directory: apps/studio
        run: npm ci --prefer-offline --no-audit
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Add Intel Rust target
        if: matrix.target == 'x86_64-apple-darwin'
        run: rustup target add x86_64-apple-darwin
      - name: Build Tauri bundle
        shell: bash
        working-directory: src-tauri
        run: |
          set -euo pipefail
          tauri build --target "${{ matrix.target }}" --bundles "${{ matrix.bundle }}"
      - name: Normalize release artifact
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
          ARTIFACT_GLOB: ${{ matrix.artifact_glob }}
        run: |
          set -euo pipefail
          mkdir -p dist-release
          case "${{ matrix.target }}" in
            aarch64-apple-darwin)
              stable_name="Uni-HWP_macos_aarch64_ko-KR_v${RELEASE_VERSION}.dmg"
              ;;
            x86_64-apple-darwin)
              stable_name="Uni-HWP_macos_x64_ko-KR_v${RELEASE_VERSION}.dmg"
              ;;
            *)
              echo "Unsupported macOS target: ${{ matrix.target }}" >&2
              exit 1
              ;;
          esac
          artifact="$(ls $ARTIFACT_GLOB | head -n 1)"
          cp "$artifact" "dist-release/$stable_name"
          shasum -a 256 "dist-release/$stable_name" > "dist-release/$stable_name.sha256"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            dist-release/*
  build-linux:
    name: Linux x64 AppImage
    needs: [prepare-release, preflight, compatibility-check, build-wasm-pkg]
    if: needs.preflight.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - name: Download WASM pkg artifact
        uses: actions/download-artifact@v7
        with:
          name: uni-hwp-wasm-pkg-desktop
          path: pkg
      - name: Install frontend dependencies
        working-directory: apps/studio
        run: npm ci --prefer-offline --no-audit
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build Linux AppImage
        shell: bash
        working-directory: src-tauri
        run: |
          set -euo pipefail
          cargo clean
          tauri build --bundles "appimage"
      - name: Normalize release artifact
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist-release
          artifact="$(ls target/release/bundle/appimage/*.AppImage | head -n 1)"
          stable_name="Uni-HWP_linux_x64_ko-KR_v${RELEASE_VERSION}.AppImage"
          cp "$artifact" "dist-release/$stable_name"
          shasum -a 256 "dist-release/$stable_name" > "dist-release/$stable_name.sha256"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64-appimage
          path: |
            dist-release/*
  build-linux-arm64:
    name: Linux ARM64 AppImage
    needs: [prepare-release, preflight, compatibility-check, build-wasm-pkg]
    if: needs.preflight.outputs.should_build == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Configure parallel build
        shell: bash
        run: |
          set -euo pipefail
          jobs="$(nproc)"
          echo "CARGO_BUILD_JOBS=$jobs" >> "$GITHUB_ENV"
          echo "MAKEFLAGS=-j$jobs" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$jobs" >> "$GITHUB_ENV"
          echo "RAYON_NUM_THREADS=$jobs" >> "$GITHUB_ENV"
          echo "Using $jobs CPU workers"
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf file binutils libfuse2
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - name: Download WASM pkg artifact
        uses: actions/download-artifact@v7
        with:
          name: uni-hwp-wasm-pkg-desktop
          path: pkg
      - name: Install frontend dependencies
        working-directory: apps/studio
        run: npm ci --prefer-offline --no-audit
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Verify ARM64 toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          tauri --version
      - name: Build Linux ARM64 AppImage
        shell: bash
        working-directory: src-tauri
        run: tauri build --bundles "appimage"
      - name: Normalize ARM64 release artifact
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist-release
          artifact="$(find . -type f -path '*/bundle/appimage/*.AppImage' -print -quit)"
          test -n "$artifact"
          stable_name="Uni-HWP_linux_arm64_ko-KR_v${RELEASE_VERSION}.AppImage"
          cp "$artifact" "dist-release/$stable_name"
          file "dist-release/$stable_name" | grep -Eiq 'aarch64|arm64'
          sha256sum "dist-release/$stable_name" > "dist-release/$stable_name.sha256"
      - name: Upload ARM64 workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm64-appimage
          path: dist-release/*
  publish-release:
    name: Publish verified Uni-HWP release
    needs: [prepare-release, preflight, build-windows, build-macos, build-linux, build-linux-arm64]
    if: needs.preflight.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Windows artifacts
        uses: actions/download-artifact@v7
        with:
          name: windows-x64-release-bundles
          path: release-assets

      - name: Download macOS artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: macOS *
          path: release-assets
          merge-multiple: true

      - name: Download Linux artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: linux-*-appimage
          path: release-assets
          merge-multiple: true

      - name: Verify metadata and release assets
        id: verify
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(Path('release/uni-hwp-release.json').read_text(encoding='utf-8'))
          if metadata.get('productVersion') != '${{ needs.prepare-release.outputs.version }}':
              raise SystemExit('productVersion does not match release metadata')
          if metadata.get('releaseTag') != '${{ needs.prepare-release.outputs.tag }}':
              raise SystemExit('releaseTag does not match release metadata')
          if metadata.get('compatibilityStatus') != 'compatible':
              raise SystemExit('candidate is not marked compatible')
          if not metadata.get('engineCommit') or not metadata.get('engineSourceHash'):
              raise SystemExit('engine provenance is incomplete')
          PY
          expected=(
            "Uni-HWP_windows_x64_ko-KR_setup_v${RELEASE_VERSION}.exe"
            "Uni-HWP_windows_x64_ko-KR_msi_v${RELEASE_VERSION}.msi"
            "Uni-HWP_windows_x64_ko-KR_portable_v${RELEASE_VERSION}.zip"
            "Uni-HWP_macos_aarch64_ko-KR_v${RELEASE_VERSION}.dmg"
            "Uni-HWP_macos_x64_ko-KR_v${RELEASE_VERSION}.dmg"
            "Uni-HWP_linux_x64_ko-KR_v${RELEASE_VERSION}.AppImage"
            "Uni-HWP_linux_arm64_ko-KR_v${RELEASE_VERSION}.AppImage"
          )
          for name in "${expected[@]}"; do
            test -s "release-assets/$name"
            test -s "release-assets/$name.sha256"
          done
          release_key="${RELEASE_VERSION}|${RELEASE_TAG}|$(python -c "import json; print(json.load(open('release/uni-hwp-release.json'))['engineCommit'])")|$(python -c "import json; print(json.load(open('release/uni-hwp-release.json'))['engineSourceHash'])")"
          echo "release_key=$release_key" >> "$GITHUB_OUTPUT"

      - name: Create release after all builds pass
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
          RELEASE_KEY: ${{ steps.verify.outputs.release_key }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json body --jq .body | grep -Fq "releaseKey: $RELEASE_KEY"; then
              echo "ALREADY_BUILT: $RELEASE_KEY"
              exit 0
            fi
            echo "Release tag $RELEASE_TAG already exists with different provenance; refusing to overwrite." >&2
            exit 1
          fi
          shell_version="$(python -c "import json; print(json.load(open('release/uni-hwp-release.json'))['shellVersion'])")"
          engine_version="$(python -c "import json; print(json.load(open('release/uni-hwp-release.json'))['engineVersion'])")"
          notes="$(printf 'Uni-HWP 통합 버전: %s\n외피/API 버전: %s\nRHWP 엔진: v%s\nreleaseKey: %s\n' "$RELEASE_VERSION" "$shell_version" "$engine_version" "$RELEASE_KEY")"
          gh release create "$RELEASE_TAG" --repo "${{ github.repository }}" --target "${GITHUB_SHA}" --title "$RELEASE_TAG" --notes "$notes"
          gh release upload "$RELEASE_TAG" release-assets/* --repo "${{ github.repository }}"
